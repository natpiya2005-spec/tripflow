<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TripFlow V0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:system-ui,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer;border:0}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e5e9ef;padding:20px 14px}.logo{font-size:21px;font-weight:850;margin:5px 9px 28px}.nav,.day{padding:10px 12px;border-radius:9px;color:#667085;margin:4px 0}.active{background:#edf4ff;color:#1769ff;font-weight:750}.label{font-size:11px;color:#98a2b3;margin:25px 10px 8px}
.main{padding:22px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px}.title{font-size:25px;font-weight:850}.sub{color:#667085;font-size:13px}.btn{padding:9px 12px;border-radius:9px;background:#fff;border:1px solid #dfe5ed}.primary{background:#1769ff;color:#fff}
.grid{display:grid;grid-template-columns:minmax(430px,600px) 1fr;gap:16px;margin-top:18px}.panel,.map{background:#fff;border:1px solid #e1e6ed;border-radius:16px;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between}.prompt{padding:15px;border-bottom:1px solid #edf0f4}.promptbox{border:1px solid #dce3eb;border-radius:12px;padding:11px}.promptbox textarea{width:100%;min-height:75px;border:0;outline:0;resize:none}.under{display:flex;justify-content:space-between;align-items:center}.hint{font-size:11px;color:#98a2b3}.ai{background:#172033;color:#fff;padding:9px 12px;border-radius:8px;font-weight:750}
.timeline{padding:15px 18px}.card{position:relative;margin:0 0 10px 50px;padding:12px;border:1px solid #e1e6ed;border-radius:12px;background:#fff}.card.dragging{opacity:.4}.time{position:absolute;left:-84px;top:12px;color:#1769ff;font-size:11px;font-weight:750}.dot{position:absolute;left:-36px;top:17px;width:10px;height:10px;background:#1769ff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #d9e2ee}.grip{position:absolute;right:10px;color:#98a2b3;cursor:grab}.type{font-size:11px;color:#98a2b3}.card h3{margin:3px 0;font-size:14px}.meta{font-size:11px;color:#667085}.actions{display:flex;gap:6px;margin-top:8px}.small{padding:6px 8px;border-radius:7px;background:#f2f4f7;color:#344054;font-size:10px}.drop{height:8px;margin-left:50px}.drop.over{background:#dce9ff;border-radius:8px}.addline{margin-left:50px;border:2px dashed #dce3ee;border-radius:10px;padding:12px;text-align:center;color:#98a2b3}
.map{position:relative;min-height:650px;background:#edf4f0}.mapbg{position:absolute;inset:0;background:linear-gradient(20deg,transparent 45%,#d7e3db 46%,#d7e3db 47%,transparent 48%),linear-gradient(150deg,transparent 46%,#dce7ef 47%,#dce7ef 48%,transparent 49%)}.maptag{position:absolute;top:15px;left:15px;background:#fff;padding:9px 12px;border-radius:9px;box-shadow:0 3px 12px #10182812;font-weight:700}.mapmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#98a2b3}.mapmsg div{background:#fff;padding:18px 22px;border-radius:13px;box-shadow:0 4px 18px #10182812}.pin{position:absolute;width:30px;height:30px;display:grid;place-items:center;background:#1769ff;color:#fff;border:4px solid #fff;border-radius:50%;font-weight:800}.route{position:absolute;height:5px;background:#1769ff;border-radius:99px;transform-origin:left center}.bottom{position:absolute;bottom:15px;left:15px;right:15px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 4px 18px #10182818;font-size:11px}.bottom b{display:block;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:#10182866;align-items:center;justify-content:center}.box{background:#fff;width:min(430px,100%);padding:20px;border-radius:15px}.field{width:100%;padding:9px;border:1px solid #dfe5ed;border-radius:8px;margin:5px 0 10px}.toast{display:none;position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 14px;border-radius:9px}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style>
<div class="app"><aside class="side"><div class="logo">✈️ TripFlow</div><div class="nav active">🏠 ทริปของฉัน</div><div class="nav">🗺️ แผนที่</div><div class="nav">🎫 การจอง</div><div class="label">วันเดินทาง</div><div class="day active">Day 1</div><div class="day">Day 2</div><div class="day">Day 3</div></aside>
<main class="main"><div class="top"><div><div class="title">Japan Trip 🇯🇵</div><div class="sub">V0.1 · ทดลองแบบ ฿0</div></div><button class="btn" onclick="clearAll()">ล้าง Day 1</button></div>
<div class="grid"><section class="panel"><div class="head"><b>Day 1 · 12 Sep</b><button class="btn primary" onclick="addBlock()">＋ เพิ่ม</button></div>
<div class="prompt"><div class="promptbox"><textarea id="prompt" placeholder="เช่น ถึงสนามบิน 11 โมง อยากกินข้าวก่อนแล้วค่อยไปโรงแรม"></textarea><div class="under"><span class="hint">AI จำลอง · ยังไม่เสียค่า API</span><button class="ai" onclick="aiDraft()">✨ สร้าง Plan</button></div></div></div>
<div id="timeline" class="timeline"></div></section>
<section class="map"><div class="mapbg"></div><div class="maptag">🗺️ Route Preview</div><div id="mapmsg" class="mapmsg"><div><b>ยังไม่มี Route</b><br><small>สร้าง Block อย่างน้อย 2 จุด</small></div></div><div id="pins"></div><div id="routes"></div><div class="bottom"><span style="color:#98a2b3">TRIPFLOW V0.1</span><b id="summary">ยังไม่มีแผน</b><span id="summaryMeta">AI ช่วยร่าง → มึงแก้เอง</span></div></section></div></main></div>
<div class="modal" id="modal"><div class="box"><button class="btn" style="float:right" onclick="closeModal()">✕</button><h3>แก้ไข Block</h3><label>เวลา</label><input id="etime" class="field"><label>ชื่อ</label><input id="ename" class="field"><label>รายละเอียด</label><input id="emeta" class="field"><button class="btn primary" onclick="saveEdit()">บันทึก</button></div></div><div id="toast" class="toast"></div>
<script>
let blocks=JSON.parse(localStorage.getItem('tripflow_blocks')||'[]'),dragId=null,editId=null;
const starter=[['11:00','✈️','จุดเริ่มต้น','Narita Airport','ถึงสนามบิน'],['11:30','🍜','อาหาร','เลือกมื้ออาหาร','เลือกเองว่าจะกินร้านไหน'],['12:40','🚆','การเดินทาง','เลือกวิธีไปโรงแรม','Train / Bus / Taxi'],['13:30','🏨','ที่พัก','เลือกโรงแรม','เพิ่มโรงแรมภายหลัง']];
function save(){localStorage.setItem('tripflow_blocks',JSON.stringify(blocks))}
function render(){let t=document.getElementById('timeline');t.innerHTML='';if(!blocks.length){t.innerHTML='<div style="padding:55px 20px;text-align:center;color:#98a2b3">เริ่มจากช่องด้านบน หรือกด ＋ เพิ่ม</div>';updateMap();return}blocks.forEach((b,i)=>{t.innerHTML+=`<div class="drop" data-drop="${i}" ondragover="allow(event)" ondrop="drop(event)"></div><div class="card" draggable="true" data-id="${b.id}" ondragstart="drag(event)" ondragend="endDrag"><div class="dot"></div><div class="time">${b.time}</div><div class="grip">⠿</div><div class="type">${b.icon} ${b.type}</div><h3>${b.title}</h3><div class="meta">${b.meta}</div><div class="actions"><button class="small" onclick="edit(${b.id})">✏️ แก้</button><button class="small" onclick="removeBlock(${b.id})">ลบ</button></div></div>`});t.innerHTML+=`<div class="drop" data-drop="${blocks.length}" ondragover="allow(event)" ondrop="drop(event)"></div><div class="addline" onclick="addBlock()">＋ เพิ่มสิ่งที่ต้องทำ</div>`;updateMap()}
function aiDraft(){if(!document.getElementById('prompt').value.trim()){toast('พิมพ์ก่อนว่าอยากทำอะไร');return}blocks=starter.map(x=>({id:Date.now()+Math.random(),time:x[0],icon:x[1],type:x[2],title:x[3],meta:x[4]}));save();render();toast('✨ AI จำลองแตกข้อความเป็น Block แล้ว — จากนี้มึงคุมเอง')}
function addBlock(){blocks.push({id:Date.now()+Math.random(),time:'15:00',icon:'📍',type:'สถานที่',title:'สถานที่ใหม่',meta:'กดแก้เพื่อปรับรายละเอียด'});save();render();toast('＋ เพิ่ม Block แล้ว')}
function edit(id){let b=blocks.find(x=>x.id==id);editId=id;etime.value=b.time;ename.value=b.title;emeta.value=b.meta;modal.style.display='flex'}
function saveEdit(){let b=blocks.find(x=>x.id==editId);b.time=etime.value;b.title=ename.value;b.meta=emeta.value;save();closeModal();render();toast('✏️ แก้ไขแล้ว')}
function removeBlock(id){blocks=blocks.filter(x=>x.id!=id);save();render();toast('ลบแล้ว')}
function drag(e){dragId=+e.currentTarget.dataset.id;e.currentTarget.classList.add('dragging')}
function allow(e){e.preventDefault();document.querySelectorAll('.drop').forEach(x=>x.classList.remove('over'));e.currentTarget.classList.add('over')}
function drop(e){e.preventDefault();let target=+e.currentTarget.dataset.drop,from=blocks.findIndex(x=>x.id==dragId);if(from<0)return;let b=blocks.splice(from,1)[0];if(target>from)target--;blocks.splice(target,0,b);save();endDrag();render();toast('↕️ เปลี่ยนลำดับแล้ว')}
function endDrag(){dragId=null;document.querySelectorAll('.drop').forEach(x=>x.classList.remove('over'));document.querySelectorAll('.card').forEach(x=>x.classList.remove('dragging'))}
function updateMap(){let m=document.getElementById('mapmsg'),p=document.getElementById('pins'),r=document.getElementById('routes');p.innerHTML='';r.innerHTML='';if(blocks.length<2){m.style.display='grid';summary.textContent=blocks.length?'1 จุด':'ยังไม่มีแผน';return}m.style.display='none';let pos=[[12,25],[48,31],[80,50],[62,72]];blocks.slice(0,4).forEach((b,i)=>p.innerHTML+=`<div class="pin" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${i+1}</div>`);for(let i=0;i<Math.min(blocks.length-1,3);i++)r.innerHTML+=`<div class="route" style="left:${pos[i][0]+2}%;top:${pos[i][1]+2}%;width:${Math.max(15,pos[i+1][0]-pos[i][0]-2)}%;transform:rotate(${[8,25,-30][i]}deg)"></div>`);summary.textContent=blocks.map(b=>b.title).join(' → ');summaryMeta.textContent=blocks.length+' Blocks · ลากเพื่อเปลี่ยนลำดับ'}
function clearAll(){blocks=[];save();render();toast('ล้าง Day 1 แล้ว')}function closeModal(){modal.style.display='none'}function toast(m){let x=document.getElementById('toast');x.textContent=m;x.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>x.style.display='none',2400)}render()
</script></html>
